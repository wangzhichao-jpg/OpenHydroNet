[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openhydronet"
version = "0.1.0.dev1"
description = "Offline heating and cooling hydraulic network solver"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = ["numpy==2.4.3", "scipy==1.17.1"]

[project.scripts]
openhydronet = "openhydronet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
